<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verse of the Day</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      color: #323130;
      padding: 12px 16px;
    }
    #mannaverse { font-size: 18px; line-height: 1.5; margin: 0 0 8px; }
    #mannaverse-reference { font-size: 14px; font-weight: 600; margin: 0; color: #605e5c; }
    #mannaverse-version { font-weight: 400; margin-left: 4px; }
    .attribution { font-size: 11px; margin: 8px 0 0; color: #8a8886; }
    .attribution a { color: inherit; }
    .attribution .notice { display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <!--
    URL parameters (all optional):
      order=random       new OurManna verse on every load (default: daily)
      translation=bsb    translation to show, via the Free Use Bible API (default: kjv)
                         (bsb, kjv, web, webbe, nasb, amp, net, asv, bbe, darby, dra, ylt,
                         or any translation ID from https://bible.helloao.org/api/available_translations.json;
                         niv shows OurManna's own NIV text)
      ref=John 3:16      show a fixed passage instead of OurManna's pick (niv isn't available here)
  -->
  <div id="ourmanna-verse">
    <div id="mannaverse-container">
      <p id="mannaverse">Loading...</p>
      <p id="mannaverse-reference"></p>
    </div>
  </div>
  <p class="attribution" id="attribution"></p>

  <script>
    (function () {
      // Friendly names for common Free Use Bible API translation IDs
      var TRANSLATIONS = {
        bsb: 'BSB', kjv: 'eng_kjv', web: 'ENGWEBP', webbe: 'eng_webpb',
        nasb: 'NASB2020', amp: 'AMP', net: 'eng_net',
        asv: 'eng_asv', bbe: 'eng_bbe', darby: 'eng_dby', dra: 'eng_dra', ylt: 'eng_ylt'
      };

      // Book name (lowercase, letters and digits only) -> USFM book ID used by the API
      var BOOKS = {};
      ('GEN genesis|EXO exodus|LEV leviticus|NUM numbers|DEU deuteronomy|JOS joshua|JDG judges|RUT ruth|' +
       '1SA 1samuel|2SA 2samuel|1KI 1kings|2KI 2kings|1CH 1chronicles|2CH 2chronicles|EZR ezra|NEH nehemiah|' +
       'EST esther|JOB job|PSA psalms psalm|PRO proverbs|ECC ecclesiastes|SNG songofsongs songofsolomon|' +
       'ISA isaiah|JER jeremiah|LAM lamentations|EZK ezekiel|DAN daniel|HOS hosea|JOL joel|AMO amos|' +
       'OBA obadiah|JON jonah|MIC micah|NAM nahum|HAB habakkuk|ZEP zephaniah|HAG haggai|ZEC zechariah|' +
       'MAL malachi|MAT matthew|MRK mark|LUK luke|JHN john|ACT acts|ROM romans|1CO 1corinthians|' +
       '2CO 2corinthians|GAL galatians|EPH ephesians|PHP philippians|COL colossians|1TH 1thessalonians|' +
       '2TH 2thessalonians|1TI 1timothy|2TI 2timothy|TIT titus|PHM philemon|HEB hebrews|JAS james|' +
       '1PE 1peter|2PE 2peter|1JN 1john|2JN 2john|3JN 3john|JUD jude|REV revelation revelations')
        .split('|').forEach(function (entry) {
          var names = entry.split(' ');
          names.forEach(function (name) { BOOKS[name.toLowerCase()] = names[0]; });
        });

      var params = new URLSearchParams(location.search);
      var order = params.get('order') === 'random' ? 'random' : 'daily';
      var ref = (params.get('ref') || '').trim();
      var requested = (params.get('translation') || 'kjv').trim();
      if (requested.toLowerCase() === 'niv') requested = ref ? 'kjv' : '';
      var alias = requested.toLowerCase();
      var translationId = TRANSLATIONS[alias] || requested;
      var label = TRANSLATIONS[alias] ? alias.toUpperCase() : '';

      var verseEl = document.getElementById('mannaverse');
      var refEl = document.getElementById('mannaverse-reference');
      var attrEl = document.getElementById('attribution');

      function link(href, text) {
        var a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = text;
        return a;
      }

      function show(text, reference, version) {
        verseEl.textContent = text.replace(/\s+/g, ' ').trim();
        var small = document.createElement('small');
        var i = document.createElement('i');
        small.id = 'mannaverse-version';
        i.textContent = '(' + version + ')';
        small.appendChild(i);
        refEl.textContent = reference;
        refEl.appendChild(small);
      }

      function credit(fromManna, translationName, notice) {
        attrEl.textContent = '';
        if (fromManna) {
          attrEl.append(translationName ? 'Verse chosen by ' : 'Powered by ', link('https://www.ourmanna.com/', 'OurManna.com'));
        }
        if (translationName) {
          if (fromManna) attrEl.append(' · ');
          attrEl.append(translationName + ' via ', link('https://bible.helloao.org/', 'Free Use Bible API'));
        }
        if (notice) {
          var span = document.createElement('span');
          span.className = 'notice';
          span.textContent = notice.replace(/\s+/g, ' ').trim();
          attrEl.appendChild(span);
        }
      }

      function fail() {
        verseEl.textContent = 'Verse of the day is unavailable right now.';
        refEl.textContent = '';
        attrEl.textContent = '';
      }

      function getJson(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
      }

      // "Romans 2:7-8", "1 John 4:8", "Psalm 23", "Romans 8:38-9:1"
      function parseRef(text) {
        var m = /^(.+?)\s*(\d+)(?::(\d+)(?:\s*[-–]\s*(?:(\d+):)?(\d+))?)?$/.exec(text.trim());
        if (!m) return null;
        var book = BOOKS[m[1].toLowerCase().replace(/[^a-z0-9]/g, '')];
        if (!book) return null;
        var chapter = +m[2];
        return {
          book: book,
          startCh: chapter,
          startV: m[3] ? +m[3] : 1,
          endCh: m[4] ? +m[4] : chapter,
          endV: m[5] ? +m[5] : (m[3] ? +m[3] : Infinity)
        };
      }

      function formatRef(bookName, r) {
        var s = bookName + ' ' + r.startCh;
        if (r.endV === Infinity) return s;
        s += ':' + r.startV;
        if (r.endCh !== r.startCh) return s + '-' + r.endCh + ':' + r.endV;
        return r.endV !== r.startV ? s + '-' + r.endV : s;
      }

      // Verse content mixes plain strings with {text}, {noteId}, {lineBreak} and {heading} objects
      function verseText(item) {
        return item.content.map(function (part) {
          return typeof part === 'string' ? part : (part.text || ' ');
        }).join(' ').replace(/¶/g, ' ');  // KJV paragraph marks
      }

      function fromFreeBible(reference, fromManna) {
        var r = parseRef(reference);
        if (!r || r.endCh < r.startCh || r.endCh - r.startCh > 2) {
          return Promise.reject(new Error('Unsupported reference: ' + reference));
        }
        var urls = [];
        for (var c = r.startCh; c <= r.endCh; c++) {
          urls.push('https://bible.helloao.org/api/' + encodeURIComponent(translationId) + '/' + r.book + '/' + c + '.json');
        }
        return Promise.all(urls.map(getJson)).then(function (chapters) {
          var parts = [];
          chapters.forEach(function (d) {
            var ch = d.chapter.number;
            d.chapter.content.forEach(function (item) {
              if (item.type !== 'verse') return;
              if (ch === r.startCh && item.number < r.startV) return;
              if (ch === r.endCh && item.number > r.endV) return;
              parts.push(verseText(item));
            });
          });
          if (!parts.length) throw new Error('Passage not found: ' + reference);
          var t = chapters[0].translation;
          show(parts.join(' '), formatRef(chapters[0].book.commonName, r), label || t.shortName);
          credit(fromManna, t.name, t.licenseNotice);
        });
      }

      if (ref) {
        fromFreeBible(ref, false).catch(fail);
        return;
      }

      getJson('https://beta.ourmanna.com/api/v1/get?format=json&order=' + order)
        .then(function (d) {
          var v = d.verse.details;
          function showManna() {
            show(v.text, v.reference, v.version);
            credit(true);
          }
          if (!translationId) return showManna();
          // Unknown translation, unparseable reference or passage missing from it: keep OurManna's own text
          return fromFreeBible(v.reference, true).catch(showManna);
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
